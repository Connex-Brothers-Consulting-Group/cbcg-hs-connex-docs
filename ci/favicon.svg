<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .light-fav { display: block; }
    .dark-fav { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-fav { display: none; }
      .dark-fav { display: block; }
    }
  </style>
  <image class="light-fav" href="data:image/webp;base64," x="0" y="0" width="64" height="64" />
  <image class="dark-fav" href="data:image/webp;base64," x="0" y="0" width="64" height="64" />
</svg>