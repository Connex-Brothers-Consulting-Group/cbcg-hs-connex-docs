<svg viewBox="0 0 618 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .connex-mobius-track {
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: #ffffff;
    }
    .connex-mobius-flow {
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: #003db3;
      stroke-dasharray: 202 359;
      stroke-dashoffset: 0;
      animation: connexLogoMobiusTrace 4s linear infinite;
    }
    @keyframes connexLogoMobiusTrace {
      0% {
        stroke-dasharray: 202 359;
        stroke-dashoffset: 0;
        animation-timing-function: linear;
      }
      22% {
        stroke-dasharray: 202 359;
        stroke-dashoffset: 0;
        animation-timing-function: cubic-bezier(0.42, 0, 0.58, 1);
      }
      50% {
        stroke-dasharray: 260 301;
        stroke-dashoffset: -252;
        animation-timing-function: linear;
      }
      72% {
        stroke-dasharray: 260 301;
        stroke-dashoffset: -252;
        animation-timing-function: cubic-bezier(0.42, 0, 0.58, 1);
      }
      100% {
        stroke-dasharray: 202 359;
        stroke-dashoffset: -561;
      }
    }
    .connex-logo-letters {
      fill: #003db3;
    }
  </style>

  <!-- 1. Mobius Track (Extended C arc -> Crossover to O -> O loop -> Crossover back to C) -->
  <path
    d="M 78.9 19.6 A 43 43 0 1 0 78.9 80.4 C 94.9 64.4, 110.6 35.6, 126.6 19.6 A 43 43 0 1 1 126.6 80.4 C 110.6 64.4, 94.9 35.6, 78.9 19.6 Z"
    class="connex-mobius-track"
  />

  <!-- 2. Animated Mobius Flow (Starts at C, draws extended C, flows through Mobius track into O, then loops back to C) -->
  <path
    d="M 78.9 19.6 A 43 43 0 1 0 78.9 80.4 C 94.9 64.4, 110.6 35.6, 126.6 19.6 A 43 43 0 1 1 126.6 80.4 C 110.6 64.4, 94.9 35.6, 78.9 19.6 Z"
    class="connex-mobius-flow"
  />

  <!-- 3. NNEX Letters -->
  <g class="connex-logo-letters">
    <!-- N1 -->
    <path d="M 232 98 L 232 2 L 243 2 L 243 14 C 248 5, 258 0, 270 0 C 290 0, 306 14, 306 37 L 306 98 L 295 98 L 295 37 C 295 21, 284 11, 269 11 C 254 11, 243 21, 243 37 L 243 98 Z" />
    <!-- N2 -->
    <path d="M 335 98 L 335 2 L 346 2 L 346 14 C 351 5, 361 0, 373 0 C 393 0, 409 14, 409 37 L 409 98 L 398 98 L 398 37 C 398 21, 387 11, 372 11 C 357 11, 346 21, 346 37 L 346 98 Z" />
    <!-- E -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 478 0 C 453 0, 434 22, 434 50 C 434 78, 453 100, 478 100 C 500 100, 517 88, 522 70 L 510 66 C 506 80, 493 89, 478 89 C 459 89, 445 74, 445 55 L 523 55 L 523 50 C 523 22, 503 0, 478 0 Z M 478 11 C 493 11, 504 22, 511 44 L 445 44 C 452 22, 463 11, 478 11 Z"
    />
    <!-- X -->
    <path d="M 536 2 L 550 2 L 576 45 L 602 2 L 616 2 L 583 50 L 616 98 L 602 98 L 576 55 L 550 98 L 536 98 L 569 50 Z" />
  </g>
</svg>
