<svg viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .connex-fav-track {
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: rgba(0, 61, 179, 0.15);
    }
    .connex-fav-flow {
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: #003db3;
    }
    @media (prefers-color-scheme: dark) {
      .connex-fav-track {
        stroke: rgba(255, 255, 255, 0.22);
      }
      .connex-fav-flow {
        stroke: #d55e08;
      }
    }
  </style>
  <!-- 1. Mobius Base Track (Light: Blue-tinted 15% / Dark: White 22%) -->
  <path
    d="M 78.9 19.6 A 43 43 0 1 0 78.9 80.4 C 94.9 64.4, 110.6 35.6, 126.6 19.6 A 43 43 0 1 1 126.6 80.4 C 110.6 64.4, 94.9 35.6, 78.9 19.6 Z"
    class="connex-fav-track"
  />
  <!-- 2. Mobius Highlight Flow (Light: #003DB3 Blue / Dark: #D55E08 Orange) -->
  <path
    d="M 78.9 19.6 A 43 43 0 1 0 78.9 80.4 C 94.9 64.4, 110.6 35.6, 126.6 19.6 A 43 43 0 1 1 126.6 80.4 C 110.6 64.4, 94.9 35.6, 78.9 19.6 Z"
    class="connex-fav-flow"
  />
</svg>
